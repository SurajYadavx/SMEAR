[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── DIWALI CAMPAIGN REDIRECTS ───────────────────────────────
[[redirects]]
  from = "/diwali-offer"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/diwali-offer/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/diwali-offer.html"
  to = "/"
  status = 301
  force = true
