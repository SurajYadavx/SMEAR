<html lang="en" id="html-root">

    <meta charset="UTF-8" />

    <title>My Cart — Smear Pathology Indapur</title>
    <meta name="description" content="Review your selected health packages and tests, then book via WhatsApp at Smear Pathology, Indapur, Pune." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://smearpathology.in/cart.html" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/assets/logo/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="./src/styles/v2-additions.css" />
    <link rel="stylesheet" href="./src/styles/v3-polish.css" />

  <body>
    <div id="site-header"></div>

    <!-- ════════════════════════════════════════════════════
       CART PAGE
    ════════════════════════════════════════════════════ -->
    <main class="cart-page-main" id="cart-page-main">
      <div class="container">
        <div class="cart-page-header">
          <h1 class="cart-page-title">My Cart</h1>
          <a href="shop.html" class="cart-continue-link">← Continue Browsing</a>
        </div>

        <!-- Empty cart state -->
        <div id="cart-empty-state" class="cart-empty-state" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="64" height="64" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <p>Your cart is empty.</p>
          <a href="shop.html" class="btn btn--primary">Browse Packages</a>
        </div>

        <!-- Cart with items -->
        <div id="cart-has-items" style="display:none">
          <div class="cart-layout">
            <!-- Line items -->
            <div class="cart-items" id="cart-items-list" aria-label="Cart items" role="list"></div>

            <!-- Cart summary -->
            <aside class="cart-summary" aria-label="Order summary">
              <h2 class="cart-summary__title">Summary</h2>
              <div class="cart-summary__row">
                <span>Items</span>
                <span id="cart-item-count">0</span>
              </div>
              <div class="cart-summary__row cart-summary__row--total">
                <span>Approximate Total</span>
                <strong id="cart-total-display">₹0</strong>
              </div>
              <p class="cart-summary__note">Approximate total — final amount confirmed by the lab.</p>
              <a href="#" id="cart-wa-book-btn" class="btn btn--green btn--full cart-wa-btn" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" width="20" height="20"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.469 2.023 7.773L0 32l8.466-2.018A15.93 15.93 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm8.222 22.403c-.347.974-2.017 1.859-2.777 1.977-.71.11-1.608.155-2.592-.163-.599-.19-1.369-.445-2.352-.871-4.14-1.784-6.845-5.959-7.052-6.237-.208-.278-1.693-2.252-1.693-4.296 0-2.043 1.073-3.049 1.453-3.463.381-.413.832-.516 1.108-.516.278 0 .555.003.798.013.255.012.597-.097.934.713.347.832 1.179 2.876 1.284 3.085.104.208.174.451.035.728-.139.278-.208.451-.415.694-.208.243-.437.543-.624.729-.208.208-.424.432-.182.847.242.416 1.076 1.776 2.31 2.878 1.587 1.41 2.926 1.847 3.342 2.054.416.208.659.174.902-.104.243-.278 1.041-1.214 1.318-1.63.278-.416.555-.347.937-.208.381.139 2.422 1.143 2.838 1.351.416.208.693.312.797.486.104.173.104 1.006-.242 1.98z"/></svg>
                Book This on WhatsApp
              </a>
              <a href="shop.html" class="cart-summary__browse-link">Continue Browsing</a>
            </aside>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <a id="whatsapp-float" href="#" aria-label="Chat on WhatsApp" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.469 2.023 7.773L0 32l8.466-2.018A15.93 15.93 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm8.222 22.403c-.347.974-2.017 1.859-2.777 1.977-.71.11-1.608.155-2.592-.163-.599-.19-1.369-.445-2.352-.871-4.14-1.784-6.845-5.959-7.052-6.237-.208-.278-1.693-2.252-1.693-4.296 0-2.043 1.073-3.049 1.453-3.463.381-.413.832-.516 1.108-.516.278 0 .555.003.798.013.255.012.597-.097.934.713.347.832 1.179 2.876 1.284 3.085.104.208.174.451.035.728-.139.278-.208.451-.415.694-.208.243-.437.543-.624.729-.208.208-.424.432-.182.847.242.416 1.076 1.776 2.31 2.878 1.587 1.41 2.926 1.847 3.342 2.054.416.208.659.174.902-.104.243-.278 1.041-1.214 1.318-1.63.278-.416.555-.347.937-.208.381.139 2.422 1.143 2.838 1.351.416.208.693.312.797.486.104.173.104 1.006-.242 1.98z"/></svg>
      <span class="whatsapp-float__label">WhatsApp Us</span>
    </a>
    <a id="call-float" href="#" class="call-float" aria-label="Call Smear Pathology">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" /></svg>
